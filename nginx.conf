server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Every page route falls back to index.html (fixes /artist/verify/..., /ticket/..., refreshes)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted build assets can be cached for a long time
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache these, so new deploys and config changes show up immediately
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /config.js {
    add_header Cache-Control "no-cache";
  }
}